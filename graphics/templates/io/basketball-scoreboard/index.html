<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IO basketball-scoreboard</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#fff}
.hidden{display:none}
.abs{position:absolute}
.fade{opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.on{opacity:1!important;transform:none!important}
.lbl{font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.big{font-size:52px;font-weight:700;line-height:1.05}
.mid{font-size:34px;font-weight:500}
.sb{left:50%;bottom:60px;transform:translateX(-50%);background:#101010;border-radius:14px;overflow:hidden;font-size:40px;font-weight:700;display:flex;border:2px solid #f57c00}
    .t{padding:16px 30px;min-width:260px}.s{background:#f57c00;color:#000;font-size:64px;padding:12px 28px;min-width:110px;text-align:center}
    .q{padding:16px 24px;font-size:28px;background:#1d1d1d;display:flex;align-items:center}.f{font-size:22px;opacity:.7;font-weight:500}</style></head>
<body>
<div id="root" class="abs sb fade"><div class="t"><div id="home"></div><div class="f" id="hf"></div></div><div class="s" id="hs"></div><div class="q" id="period"></div><div class="s" id="as"></div><div class="t" style="text-align:right"><div id="away"></div><div class="f" id="af"></div></div></div>
<script>
// CasparCG HTML producer entry points.
var root = document.getElementById('root');
function play(){ root.classList.add('on'); }
function stop(){ root.classList.remove('on'); }
function next(){ }
function setText(id, v){ var el = document.getElementById(id); if (el) el.textContent = (v === undefined || v === null) ? '' : String(v); }
function update(str){
  var d = {};
  try { d = typeof str === 'string' ? JSON.parse(str) : (str || {}); } catch (e) { d = {}; }
  setText('home', d.home); setText('hs', d.homeScore); setText('hf', d.homeFouls ? 'Fouls '+d.homeFouls : ''); setText('away', d.away); setText('as', d.awayScore); setText('af', d.awayFouls ? 'Fouls '+d.awayFouls : ''); setText('period', d.period);
}

</script></body></html>
