<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IO program-introduction</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#fff}
.hidden{display:none}
.abs{position:absolute}
.fade{opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.on{opacity:1!important;transform:none!important}
.lbl{font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.big{font-size:52px;font-weight:700;line-height:1.05}
.mid{font-size:34px;font-weight:500}
.pi{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle at 30% 40%,#2b2b2b,#000 70%);display:flex;flex-direction:column;justify-content:center;padding:0 160px;box-sizing:border-box}
    .ttl{font-size:150px;font-weight:800;line-height:1;transform:translateX(-80px);transition:transform 1s ease}.on .ttl{transform:none}
    .sub{font-size:48px;margin-top:24px;opacity:0;transition:opacity 1s .5s}.on .sub{opacity:.9}.pre{font-size:34px;margin-top:40px;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity 1s 1s}.on .pre{opacity:.85}</style></head>
<body>
<div id="root" class="abs pi fade"><div class="lbl">Now on IO</div><div class="ttl" id="title"></div><div class="sub" id="subtitle"></div><div class="pre" id="presenter"></div></div>
<script>
// CasparCG HTML producer entry points.
var root = document.getElementById('root');
function play(){ root.classList.add('on'); }
function stop(){ root.classList.remove('on'); }
function next(){ }
function setText(id, v){ var el = document.getElementById(id); if (el) el.textContent = (v === undefined || v === null) ? '' : String(v); }
function update(str){
  var d = {};
  try { d = typeof str === 'string' ? JSON.parse(str) : (str || {}); } catch (e) { d = {}; }
  setText('title', d.title); setText('subtitle', d.subtitle); setText('presenter', d.presenter ? 'With '+d.presenter : '');
}

</script></body></html>
