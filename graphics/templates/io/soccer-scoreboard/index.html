<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IO soccer-scoreboard</title>
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#fff}
.hidden{display:none}
.abs{position:absolute}
.fade{opacity:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.on{opacity:1!important;transform:none!important}
.lbl{font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.big{font-size:52px;font-weight:700;line-height:1.05}
.mid{font-size:34px;font-weight:500}
.sb{left:50%;top:50px;transform:translateX(-50%);background:linear-gradient(#0e7a2f,#0a5a22);border:2px solid #fff;border-radius:6px;overflow:hidden;font-size:40px;font-weight:700;display:flex;flex-direction:column;min-width:900px}
    .row{display:flex;align-items:center}.t{flex:1;padding:14px 26px}.s{background:#fff;color:#0a5a22;padding:12px 26px;min-width:90px;text-align:center;font-size:56px}
    .min{background:#000;padding:10px;text-align:center;font-size:26px;letter-spacing:.1em}.sc{font-size:22px;padding:8px 26px;opacity:.9;text-align:center;font-weight:500}</style></head>
<body>
<div id="root" class="abs sb fade"><div class="row"><div class="t" id="home"></div><div class="s" id="hs"></div><div class="s" id="as"></div><div class="t" id="away" style="text-align:right"></div></div><div class="min" id="minute"></div><div class="sc" id="scorers"></div></div>
<script>
// CasparCG HTML producer entry points.
var root = document.getElementById('root');
function play(){ root.classList.add('on'); }
function stop(){ root.classList.remove('on'); }
function next(){ }
function setText(id, v){ var el = document.getElementById(id); if (el) el.textContent = (v === undefined || v === null) ? '' : String(v); }
function update(str){
  var d = {};
  try { d = typeof str === 'string' ? JSON.parse(str) : (str || {}); } catch (e) { d = {}; }
  setText('home', d.home); setText('hs', d.homeScore); setText('away', d.away); setText('as', d.awayScore); setText('minute', d.minute); setText('scorers', d.scorers);
}

</script></body></html>
