upstream io_api { server io-api:8080; }

server {
  listen 80;
  client_max_body_size 20m;

  location /api/ { proxy_pass http://io_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws { proxy_pass http://io_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  location /hls/ { proxy_pass http://io_api; proxy_buffering off; }
  location /healthz { proxy_pass http://io_api; }
  location / { return 404; }
}
